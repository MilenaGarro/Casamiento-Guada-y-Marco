<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Novios — Guada & Marco</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:        #FAF7F2;
      --burgundy:     #6B1A2A;
      --burgundy-lt:  #8B2A3E;
      --burgundy-xlt: #C07080;
      --black:        #1A1A1A;
      --white:        #FFFFFF;
      --gold:         #C4A044;
      --gold-lt:      #D4B85A;
      --verde:        #3D6355;
      --verde-lt:     #4E7D6B;
      --ff-serif: 'Cormorant Garamond', Georgia, serif;
      --ff-sans:  'Montserrat', system-ui, sans-serif;
    }

    html, body {
      min-height: 100%;
      font-family: var(--ff-sans);
      background: var(--black);
      color: var(--cream);
      font-size: 14px;
    }

    /* ── HEADER ── */
    .header {
      background: var(--black);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      padding: 0 32px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-logo {
      font-family: var(--ff-serif);
      font-size: 20px;
      font-weight: 300;
      font-style: italic;
      color: var(--cream);
    }
    .header-logo span { color: var(--gold); }
    .header-meta {
      font-size: 11px;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.25);
    }
    .btn-refresh {
      background: none;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 2px;
      color: rgba(255,255,255,0.4);
      font-family: var(--ff-sans);
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 6px 14px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex; align-items: center; gap: 6px;
    }
    .btn-refresh:hover { border-color: rgba(255,255,255,0.3); color: var(--cream); }
    .btn-refresh svg { transition: transform 0.3s; }
    .btn-refresh.spinning svg { animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── MAIN ── */
    .main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 36px 32px 80px;
    }

    /* ── KPIs ── */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 44px;
    }
    .kpi {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 2px;
      padding: 22px 20px 20px;
      position: relative;
      overflow: hidden;
    }
    .kpi::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
    }
    .kpi.k-asisten::after   { background: #66BB6A; }
    .kpi.k-no::after        { background: #EF5350; }
    .kpi.k-pend::after      { background: var(--gold); }
    .kpi.k-rest::after      { background: var(--verde-lt); }

    .kpi-label {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      margin-bottom: 10px;
    }
    .kpi-num {
      font-family: var(--ff-serif);
      font-size: 52px;
      font-weight: 300;
      line-height: 1;
      color: var(--cream);
    }
    .kpi-sub {
      margin-top: 8px;
      font-size: 11px;
      color: rgba(255,255,255,0.2);
    }

    /* ── TOOLBAR ── */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .toolbar-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    .search {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 2px;
      padding: 8px 14px;
      color: var(--cream);
      font-family: var(--ff-sans);
      font-size: 13px;
      outline: none;
      width: 220px;
      transition: border-color 0.2s;
    }
    .search:focus { border-color: rgba(255,255,255,0.2); }
    .search::placeholder { color: rgba(255,255,255,0.18); }

    .filters { display: flex; gap: 4px; }
    .ftab {
      background: none;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 2px;
      color: rgba(255,255,255,0.3);
      font-family: var(--ff-sans);
      font-size: 11px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 7px 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .ftab:hover { border-color: rgba(255,255,255,0.18); color: rgba(255,255,255,0.6); }
    .ftab.on { background: var(--burgundy); border-color: var(--burgundy); color: var(--cream); }

    .btn-csv {
      display: inline-flex; align-items: center; gap: 6px;
      background: none;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 2px;
      color: rgba(255,255,255,0.4);
      font-family: var(--ff-sans);
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 8px 16px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-csv:hover { border-color: rgba(255,255,255,0.25); color: var(--cream); }

    /* ── TABLE ── */
    .table-wrap {
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 2px;
      overflow: auto;
    }
    table { width: 100%; border-collapse: collapse; }
    thead { background: rgba(255,255,255,0.025); }
    th {
      text-align: left;
      font-size: 10px;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.28);
      padding: 11px 16px;
      font-weight: 400;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      cursor: pointer;
      white-space: nowrap;
      user-select: none;
    }
    th:hover { color: rgba(255,255,255,0.55); }
    th.sorted { color: var(--gold-lt); }
    .arr { margin-left: 3px; opacity: 0.4; }
    th.sorted .arr { opacity: 1; }

    tbody tr { border-bottom: 1px solid rgba(255,255,255,0.04); transition: background 0.1s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(255,255,255,0.025); }
    td { padding: 12px 16px; font-size: 13px; color: rgba(255,255,255,0.65); }
    td.td-name { color: var(--cream); font-weight: 500; }
    td.td-diet { font-size: 12px; color: rgba(255,255,255,0.4); max-width: 180px; }
    td.td-date { font-size: 11px; color: rgba(255,255,255,0.28); white-space: nowrap; }

    .badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 10px;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      font-weight: 500;
      white-space: nowrap;
    }
    .b-asiste    { background: rgba(102,187,106,.13); color: #81C784; border: 1px solid rgba(102,187,106,.22); }
    .b-no_asiste { background: rgba(239,83,80,.11);   color: #EF9A9A; border: 1px solid rgba(239,83,80,.2); }
    .b-pendiente { background: rgba(196,160,68,.13);  color: var(--gold-lt); border: 1px solid rgba(196,160,68,.22); }

    .empty { text-align: center; padding: 56px 24px; color: rgba(255,255,255,0.18); font-size: 13px; }

    /* pagination */
    .pager {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 14px;
      font-size: 12px;
      color: rgba(255,255,255,0.25);
    }
    .pager-btns { display: flex; gap: 3px; }
    .pbtn {
      background: none;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 2px;
      color: rgba(255,255,255,0.35);
      font-family: var(--ff-sans);
      font-size: 12px;
      padding: 5px 11px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .pbtn:hover:not(:disabled) { border-color: rgba(255,255,255,0.22); color: var(--cream); }
    .pbtn:disabled { opacity: 0.25; cursor: default; }
    .pbtn.on { background: var(--burgundy); border-color: var(--burgundy); color: var(--cream); }

    .last-upd { font-size: 11px; color: rgba(255,255,255,0.18); text-align: right; margin-top: 20px; }

    /* responsive */
    @media (max-width: 800px) {
      .kpi-grid { grid-template-columns: repeat(2,1fr); }
      .main { padding: 24px 16px 60px; }
      .header { padding: 0 16px; }
      .header-meta { display: none; }
      th:nth-child(4), td:nth-child(4),
      th:nth-child(5), td:nth-child(5) { display: none; }
      .search { width: 100%; }
      .toolbar { flex-direction: column; align-items: flex-start; }
    }
    @media (max-width: 480px) {
      .kpi-num { font-size: 40px; }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-logo">Guada <span>&</span> Marco</div>
  <div style="display:flex;align-items:center;gap:14px;">
    <span class="header-meta">23 · 01 · 2027</span>
    <button class="btn-refresh" id="btn-refresh" onclick="load()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
      Actualizar
    </button>
  </div>
</header>

<main class="main">

  <!-- KPIs -->
  <div class="kpi-grid">
    <div class="kpi k-asisten">
      <div class="kpi-label">Asisten</div>
      <div class="kpi-num" id="k-asisten">—</div>
      <div class="kpi-sub" id="k-asisten-pct"></div>
    </div>
    <div class="kpi k-no">
      <div class="kpi-label">No asisten</div>
      <div class="kpi-num" id="k-no">—</div>
      <div class="kpi-sub" id="k-no-pct"></div>
    </div>
    <div class="kpi k-pend">
      <div class="kpi-label">Sin respuesta</div>
      <div class="kpi-num" id="k-pend">—</div>
      <div class="kpi-sub" id="k-pend-pct"></div>
    </div>
    <div class="kpi k-rest">
      <div class="kpi-label">Restricciones</div>
      <div class="kpi-num" id="k-rest">—</div>
      <div class="kpi-sub">con indicaciones</div>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="toolbar-left">
      <input class="search" type="text" id="search" placeholder="Buscar invitado…" oninput="applyFilters()"/>
      <div class="filters">
        <button class="ftab on" data-f="todos"     onclick="setF('todos',this)">Todos</button>
        <button class="ftab"    data-f="asiste"    onclick="setF('asiste',this)">Asisten</button>
        <button class="ftab"    data-f="no_asiste" onclick="setF('no_asiste',this)">No asisten</button>
        <button class="ftab"    data-f="pendiente" onclick="setF('pendiente',this)">Pendientes</button>
      </div>
    </div>
    <button class="btn-csv" onclick="exportCSV()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Exportar Excel
    </button>
  </div>

  <!-- Table -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th onclick="sortBy('nombre')">Nombre <span class="arr" id="arr-nombre">↕</span></th>
          <th onclick="sortBy('asistencia_status')">Estado <span class="arr" id="arr-asistencia_status">↕</span></th>
          <th onclick="sortBy('indicaciones_alimentarias')">Restricción <span class="arr" id="arr-indicaciones_alimentarias">↕</span></th>
          <th onclick="sortBy('acompanante')">Acompañante <span class="arr" id="arr-acompanante">↕</span></th>
          <th onclick="sortBy('rsvp_at')">Confirmó <span class="arr" id="arr-rsvp_at">↕</span></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="pager">
    <span id="pager-info"></span>
    <div class="pager-btns" id="pager-btns"></div>
  </div>

  <div class="last-upd" id="last-upd"></div>

</main>

<script>
  const SUPABASE_URL = 'https://idqoqmmgiwnevkhjqomn.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_1i92fSKjNO8AMVvnStjDwQ_hUW8Qehs';
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const PAGE = 20;
  let all = [], filtered = [], page = 1, sortCol = 'nombre', sortDir = 1, activeF = 'todos';

  /* ── LOAD ── */
  async function load() {
    const btn = document.getElementById('btn-refresh');
    btn.classList.add('spinning');

    const { data, error } = await db
      .from('invitados')
      .select('id,nombre,apellido,asistencia_status,indicaciones_alimentarias,rsvp_at,acompanante_id')
      .order('apellido', { ascending: true });

    btn.classList.remove('spinning');

    if (error) {
      document.getElementById('tbody').innerHTML =
        '<tr><td colspan="5"><div class="empty">Error al cargar los datos.</div></td></tr>';
      return;
    }

    all = data || [];
    updateKPIs();
    applyFilters();

    document.getElementById('last-upd').textContent =
      'Actualizado a las ' + new Date().toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit' });
  }

  /* ── KPIs ── */
  function updateKPIs() {
    const total   = all.length;
    const asisten = all.filter(g => g.asistencia_status === 'asiste').length;
    const no      = all.filter(g => g.asistencia_status === 'no_asiste').length;
    const pend    = all.filter(g => !g.asistencia_status || g.asistencia_status === 'pendiente').length;
    const rest    = all.filter(g => g.indicaciones_alimentarias?.trim()).length;

    set('k-asisten', asisten);
    set('k-no', no);
    set('k-pend', pend);
    set('k-rest', rest);

    const pct = n => total ? Math.round(n/total*100) + '% del total' : '';
    set('k-asisten-pct', pct(asisten));
    set('k-no-pct',      pct(no));
    set('k-pend-pct',    pct(pend));
  }

  function set(id, val) { document.getElementById(id).textContent = val; }

  /* ── FILTERS ── */
  function setF(f, btn) {
    activeF = f;
    document.querySelectorAll('.ftab').forEach(t => t.classList.remove('on'));
    btn.classList.add('on');
    page = 1;
    applyFilters();
  }

  function applyFilters() {
    const q = document.getElementById('search').value.toLowerCase();
    filtered = all.filter(g => {
      const name = `${g.nombre} ${g.apellido}`.toLowerCase();
      const st   = g.asistencia_status || 'pendiente';
      return (!q || name.includes(q)) &&
        (activeF === 'todos' ||
         (activeF === 'pendiente' && (!g.asistencia_status || st === 'pendiente')) ||
         st === activeF);
    });
    doSort();
  }

  /* ── SORT ── */
  function sortBy(col) {
    sortDir = sortCol === col ? -sortDir : 1;
    sortCol = col;
    document.querySelectorAll('th').forEach(t => t.classList.remove('sorted'));
    const arrEl = document.getElementById('arr-' + col);
    if (arrEl) {
      arrEl.closest('th').classList.add('sorted');
      arrEl.textContent = sortDir === 1 ? '↑' : '↓';
    }
    doSort();
  }

  function doSort() {
    const compMap = buildCompMap();
    filtered.sort((a, b) => {
      let va, vb;
      if (sortCol === 'nombre') {
        va = `${a.apellido}${a.nombre}`.toLowerCase();
        vb = `${b.apellido}${b.nombre}`.toLowerCase();
      } else if (sortCol === 'acompanante') {
        va = a.acompanante_id ? compMap[a.acompanante_id] || '1' : '0';
        vb = b.acompanante_id ? compMap[b.acompanante_id] || '1' : '0';
      } else {
        va = (a[sortCol] || '').toString().toLowerCase();
        vb = (b[sortCol] || '').toString().toLowerCase();
      }
      return va < vb ? -sortDir : va > vb ? sortDir : 0;
    });
    page = 1;
    render();
  }

  /* ── RENDER ── */
  function buildCompMap() {
    const m = {};
    all.forEach(g => { m[g.id] = `${g.nombre} ${g.apellido}`; });
    return m;
  }

  function render() {
    const tbody   = document.getElementById('tbody');
    const compMap = buildCompMap();
    const total   = filtered.length;
    const pages   = Math.max(1, Math.ceil(total / PAGE));
    if (page > pages) page = pages;

    const start = (page - 1) * PAGE;
    const slice = filtered.slice(start, start + PAGE);

    if (!slice.length) {
      tbody.innerHTML = '<tr><td colspan="5"><div class="empty">Ningún invitado coincide.</div></td></tr>';
    } else {
      tbody.innerHTML = slice.map(g => {
        const st  = g.asistencia_status || 'pendiente';
        const bcl = st === 'asiste' ? 'b-asiste' : st === 'no_asiste' ? 'b-no_asiste' : 'b-pendiente';
        const btx = st === 'asiste' ? 'Asiste' : st === 'no_asiste' ? 'No asiste' : 'Pendiente';
        const comp = g.acompanante_id && compMap[g.acompanante_id] ? esc(compMap[g.acompanante_id]) : '<span style="opacity:.25">—</span>';
        const diet = g.indicaciones_alimentarias ? esc(g.indicaciones_alimentarias) : '<span style="opacity:.25">—</span>';
        const fecha = g.rsvp_at
          ? new Date(g.rsvp_at).toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit' })
          : '<span style="opacity:.25">—</span>';
        return `<tr>
          <td class="td-name">${esc(g.apellido)}, ${esc(g.nombre)}</td>
          <td><span class="badge ${bcl}">${btx}</span></td>
          <td class="td-diet">${diet}</td>
          <td style="font-size:13px;color:rgba(255,255,255,.45);">${comp}</td>
          <td class="td-date">${fecha}</td>
        </tr>`;
      }).join('');
    }

    // pager info
    set('pager-info', total ? `${start+1}–${Math.min(start+PAGE,total)} de ${total}` : '');

    // pager buttons
    const pb = document.getElementById('pager-btns');
    if (pages <= 1) { pb.innerHTML = ''; return; }
    let h = `<button class="pbtn" onclick="goPage(${page-1})" ${page===1?'disabled':''}>‹</button>`;
    for (let i = 1; i <= pages; i++) {
      if (pages <= 7 || i === 1 || i === pages || Math.abs(i-page) <= 1) {
        h += `<button class="pbtn ${i===page?'on':''}" onclick="goPage(${i})">${i}</button>`;
      } else if (Math.abs(i-page) === 2) {
        h += `<button class="pbtn" disabled>…</button>`;
      }
    }
    h += `<button class="pbtn" onclick="goPage(${page+1})" ${page===pages?'disabled':''}>›</button>`;
    pb.innerHTML = h;
  }

  function goPage(p) {
    const pages = Math.ceil(filtered.length / PAGE);
    if (p < 1 || p > pages) return;
    page = p; render();
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ── EXCEL EXPORT ── */
  function exportCSV() {
    const compMap = buildCompMap();

    // Build rows
    const rows = all.map(g => ({
      'Apellido':    g.apellido || '',
      'Nombre':      g.nombre   || '',
      'Estado':      g.asistencia_status === 'asiste' ? 'Asiste'
                   : g.asistencia_status === 'no_asiste' ? 'No asiste' : 'Pendiente',
      'Restricción alimentaria': g.indicaciones_alimentarias || '',
      'Acompañante': g.acompanante_id && compMap[g.acompanante_id] ? compMap[g.acompanante_id] : '',
      'Confirmó':    g.rsvp_at ? new Date(g.rsvp_at).toLocaleDateString('es-AR') : '',
    }));

    const ws = XLSX.utils.json_to_sheet(rows);

    // Column widths
    ws['!cols'] = [
      { wch: 18 }, { wch: 18 }, { wch: 12 },
      { wch: 28 }, { wch: 22 }, { wch: 12 }
    ];

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Invitados');
    XLSX.writeFile(wb, `invitados-${new Date().toISOString().slice(0,10)}.xlsx`);
  }

  load();
</script>
</body>
</html>
